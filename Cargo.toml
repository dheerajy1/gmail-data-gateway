[package]
name = "jobs-api-gateway"
version = "0.1.0"
edition = "2024"
publish = false

[workspace]
members = ["xtask", "subscriber"]

[[bin]]
name = "main"
path = "src/main.rs"

[dependencies]
axum = "0.8"
tokio = { version = "1", features = ["full"] }
tower = "0.5"
tower-http = { version = "0.6", features = ["catch-panic", "cors"] }
vercel_runtime = { version = "2.4", features = ["axum"] }
envy = "0.4"
serde = { version = "1.0", features = ["derive"] }
validator = { version = "0.21", features = ["derive"] }
chrono = { version = "0.4", default-features = false, features = ["clock"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
jsonwebtoken = { version = "11", features = ["rust_crypto"] }
subtle = "2"
serde_json = "1"
utoipa = "6"
utoipa-scalar = { version = "0.4", features = ["axum"] }
tiberius = { version = "0.12", default-features = false, features = ["tds73", "rustls"] }
bb8 = "0.9"
bb8-tiberius = { version = "0.16", default-features = false, features = ["with-tokio", "tds73", "tls"] }
bcrypt = "0.19"
dioxus = { version = "0.7", default-features = false, features = ["macro", "html", "hooks", "signals"] }
dioxus-ssr = "0.7"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
uuid = { version = "1", features = ["v7"] }
regex = "1"

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"
