name: jobs-api-gateway

services:
  # The API runs on Vercel, so this service stays disabled
  # jobs-api-gateway:
  #   container_name: jobs-api-gateway
  #   build:
  #     context: ..
  #     dockerfile: docker/Dockerfile
  #   image: jobs-api-gateway:latest
  #   restart: unless-stopped
  #   env_file:
  #     - ../.env.production
  #   ports:
  #     - "8091:8091"
  #   network_mode: bridge
  #   extra_hosts:
  #     - "host.docker.internal:host-gateway"

  # ONE permanent subscriber: all three jobs topics on one websocket
  jobs-subscriber:
    container_name: jobs-subscriber

    build:
      context: ..
      dockerfile: docker/Dockerfile.subscriber

    image: jobs-subscriber:latest

    restart: unless-stopped

    env_file:
      - ../.env.production

    network_mode: bridge

    extra_hosts:
      - "host.docker.internal:host-gateway"
