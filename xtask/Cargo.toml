[package]
name = "xtask"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
jobs-api-gateway = { path = ".." }
dotenvy = "0.15"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
tokio = { version = "1", features = ["rt"] }
